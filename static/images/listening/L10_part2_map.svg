<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 580" width="100%" style="max-width:700px;font-family:Arial,Helvetica,sans-serif">
  <rect width="700" height="580" fill="#ffffff"/>
  <!-- 校園外框 -->
  <rect x="50" y="50" width="600" height="490" fill="#f4f2ec" stroke="#8a8170" stroke-width="3" rx="10"/>
  <!-- 運動場 -->
  <rect x="520" y="62" width="118" height="120" fill="#dcecc8" stroke="#a3bf85" stroke-width="2" rx="6"/>
  <text x="579" y="127" text-anchor="middle" font-size="11" fill="#55703a" font-style="italic">sports field</text>
  <!-- 停車場 -->
  <rect x="64" y="460" width="96" height="66" fill="#e4e4e4" stroke="#aaa" stroke-width="1.5" rx="4"/>
  <text x="112" y="498" text-anchor="middle" font-size="11" fill="#555" font-style="italic">car park</text>
  <!-- 步道 -->
  <g fill="none" stroke="#cdbb9a" stroke-width="12" stroke-linecap="round">
    <path d="M350 532 L350 100"/>
    <path d="M70 300 L630 300"/>
  </g>
  <text x="372" y="440" font-size="11" fill="#6b5a3e" font-style="italic" transform="rotate(-90 372 440)">University Avenue</text>
  <!-- 鐘塔 -->
  <rect x="337" y="287" width="26" height="26" fill="#8a8170" stroke="#5c5446" stroke-width="2"/>
  <text x="400" y="330" text-anchor="middle" font-size="11" font-weight="bold" fill="#5c5446">CLOCK TOWER</text>
  <!-- 正門 -->
  <rect x="320" y="528" width="60" height="20" fill="#222" rx="3"/>
  <text x="350" y="568" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">MAIN ENTRANCE</text>
  <!-- 指北針 -->
  <g transform="translate(672,95)">
    <line x1="0" y1="24" x2="0" y2="-14" stroke="#333" stroke-width="2.5"/>
    <polygon points="0,-24 -6,-10 6,-10" fill="#333"/>
    <text x="0" y="40" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">N</text>
  </g>
  <g font-size="19" font-weight="bold" text-anchor="middle">
    <g><circle cx="270" cy="200" r="20" fill="#fff" stroke="#c0392b" stroke-width="2.5"/><text x="270" y="207" fill="#c0392b">A</text></g>
    <g><circle cx="430" cy="200" r="20" fill="#fff" stroke="#c0392b" stroke-width="2.5"/><text x="430" y="207" fill="#c0392b">B</text></g>
    <g><circle cx="590" cy="420" r="20" fill="#fff" stroke="#c0392b" stroke-width="2.5"/><text x="590" y="427" fill="#c0392b">C</text></g>
    <g><circle cx="430" cy="410" r="20" fill="#fff" stroke="#c0392b" stroke-width="2.5"/><text x="430" y="417" fill="#c0392b">D</text></g>
    <g><circle cx="230" cy="470" r="20" fill="#fff" stroke="#c0392b" stroke-width="2.5"/><text x="230" y="477" fill="#c0392b">E</text></g>
    <g><circle cx="100" cy="260" r="20" fill="#fff" stroke="#c0392b" stroke-width="2.5"/><text x="100" y="267" fill="#c0392b">F</text></g>
    <g><circle cx="350" cy="75" r="20" fill="#fff" stroke="#c0392b" stroke-width="2.5"/><text x="350" y="82" fill="#c0392b">G</text></g>
    <g><circle cx="590" cy="260" r="20" fill="#fff" stroke="#c0392b" stroke-width="2.5"/><text x="590" y="267" fill="#c0392b">H</text></g>
  </g>
  <text x="350" y="26" text-anchor="middle" font-size="18" font-weight="bold" fill="#222">NORTHGATE UNIVERSITY CAMPUS</text>
</svg>
