<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 560" width="100%" style="max-width:700px;font-family:Arial,Helvetica,sans-serif">
  <rect width="700" height="560" fill="#ffffff"/>
  <text x="350" y="26" text-anchor="middle" font-size="18" font-weight="bold" fill="#222">TARNSIDE STEAM RAILWAY</text>

  <!-- 場地外框 -->
  <rect x="30" y="40" width="640" height="490" fill="#f4f6ec" stroke="#555" stroke-width="2"/>

  <!-- 鐵道（東西橫貫） -->
  <line x1="30" y1="262" x2="670" y2="262" stroke="#555" stroke-width="3"/>
  <line x1="30" y1="276" x2="670" y2="276" stroke="#555" stroke-width="3"/>
  <g stroke="#8a7a66" stroke-width="3">
    <line x1="50" y1="256" x2="50" y2="282"/><line x1="90" y1="256" x2="90" y2="282"/><line x1="130" y1="256" x2="130" y2="282"/>
    <line x1="170" y1="256" x2="170" y2="282"/><line x1="210" y1="256" x2="210" y2="282"/><line x1="250" y1="256" x2="250" y2="282"/>
    <line x1="290" y1="256" x2="290" y2="282"/><line x1="330" y1="256" x2="330" y2="282"/><line x1="370" y1="256" x2="370" y2="282"/>
    <line x1="410" y1="256" x2="410" y2="282"/><line x1="450" y1="256" x2="450" y2="282"/><line x1="530" y1="256" x2="530" y2="282"/>
    <line x1="570" y1="256" x2="570" y2="282"/><line x1="610" y1="256" x2="610" y2="282"/><line x1="650" y1="256" x2="650" y2="282"/>
  </g>
  <rect x="42" y="288" width="118" height="20" fill="#f4f6ec"/>
  <text x="100" y="303" text-anchor="middle" font-size="12" font-style="italic" fill="#444">railway line</text>

  <!-- 月台與車站 -->
  <rect x="200" y="226" width="270" height="26" fill="#d8d3c6" stroke="#777" stroke-width="1.5"/>
  <text x="335" y="244" text-anchor="middle" font-size="13" font-weight="bold" fill="#444">PLATFORM</text>
  <rect x="265" y="150" width="140" height="66" fill="#d9b59a" stroke="#7a4f32" stroke-width="2"/>
  <text x="335" y="189" text-anchor="middle" font-size="15" font-weight="bold" fill="#5a3520">STATION</text>

  <!-- 北側沿鐵道的步道 -->
  <line x1="60" y1="244" x2="200" y2="244" stroke="#b08a52" stroke-width="5" stroke-dasharray="10 6"/>
  <line x1="510" y1="244" x2="640" y2="244" stroke="#b08a52" stroke-width="5" stroke-dasharray="10 6"/>

  <!-- 天橋與往停車場的步道 -->
  <rect x="478" y="214" width="26" height="110" fill="#ffffff" stroke="#333" stroke-width="2"/>
  <text x="491" y="205" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">FOOTBRIDGE</text>
  <line x1="491" y1="324" x2="491" y2="430" stroke="#b08a52" stroke-width="8"/>
  <line x1="491" y1="430" x2="420" y2="430" stroke="#b08a52" stroke-width="8" stroke-linecap="round"/>

  <!-- 南側往東的步道 -->
  <line x1="491" y1="312" x2="620" y2="312" stroke="#b08a52" stroke-width="5" stroke-dasharray="10 6"/>
  <line x1="620" y1="312" x2="620" y2="430" stroke="#b08a52" stroke-width="5" stroke-dasharray="10 6"/>

  <!-- 停車場 -->
  <rect x="200" y="400" width="220" height="110" fill="#e5e5e5" stroke="#777" stroke-width="2"/>
  <text x="310" y="460" text-anchor="middle" font-size="16" font-weight="bold" fill="#444">CAR PARK</text>

  <!-- 指北針 -->
  <g transform="translate(70,92)">
    <line x1="0" y1="26" x2="0" y2="-16" stroke="#333" stroke-width="2.5"/>
    <polygon points="0,-26 -7,-10 7,-10" fill="#333"/>
    <text x="0" y="44" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">N</text>
  </g>

  <!-- 位置標記 A–H -->
  <g font-size="19" font-weight="bold" text-anchor="middle">
    <g><circle cx="120" cy="365" r="20" fill="#fff" stroke="#c0392b" stroke-width="2.5"/><text x="120" y="372" fill="#c0392b">A</text></g>
    <g><circle cx="430" cy="348" r="20" fill="#fff" stroke="#c0392b" stroke-width="2.5"/><text x="430" y="355" fill="#c0392b">B</text></g>
    <g><circle cx="560" cy="365" r="20" fill="#fff" stroke="#c0392b" stroke-width="2.5"/><text x="560" y="372" fill="#c0392b">C</text></g>
    <g><circle cx="115" cy="205" r="20" fill="#fff" stroke="#c0392b" stroke-width="2.5"/><text x="115" y="212" fill="#c0392b">D</text></g>
    <g><circle cx="560" cy="185" r="20" fill="#fff" stroke="#c0392b" stroke-width="2.5"/><text x="560" y="192" fill="#c0392b">E</text></g>
    <g><circle cx="335" cy="100" r="20" fill="#fff" stroke="#c0392b" stroke-width="2.5"/><text x="335" y="107" fill="#c0392b">F</text></g>
    <g><circle cx="625" cy="85" r="20" fill="#fff" stroke="#c0392b" stroke-width="2.5"/><text x="625" y="92" fill="#c0392b">G</text></g>
    <g><circle cx="620" cy="475" r="20" fill="#fff" stroke="#c0392b" stroke-width="2.5"/><text x="620" y="482" fill="#c0392b">H</text></g>
  </g>
</svg>
