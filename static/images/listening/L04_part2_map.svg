<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 580" width="100%" style="max-width:700px;font-family:Arial,Helvetica,sans-serif">
  <rect width="700" height="580" fill="#ffffff"/>

  <!-- 場地外框 -->
  <rect x="50" y="50" width="600" height="480" fill="#f6f8ee" stroke="#555" stroke-width="2"/>

  <!-- 東側小溪 -->
  <path d="M628 50 q-14 40 0 80 t0 80 t0 80 t0 80 t0 80 t0 80" fill="none" stroke="#6ba3d0" stroke-width="9" stroke-linecap="round"/>
  <text x="612" y="300" text-anchor="middle" font-size="13" fill="#2f6a9c" font-style="italic" transform="rotate(90 612 300)">stream</text>

  <!-- 入口到舞台的步道 -->
  <line x1="350" y1="50" x2="350" y2="250" stroke="#b08a52" stroke-width="9" stroke-linecap="round"/>

  <!-- 主舞台 -->
  <rect x="295" y="255" width="110" height="70" fill="#d9b59a" stroke="#7a4f32" stroke-width="2"/>
  <text x="350" y="287" text-anchor="middle" font-size="14" font-weight="bold" fill="#5a3520">MAIN</text>
  <text x="350" y="305" text-anchor="middle" font-size="14" font-weight="bold" fill="#5a3520">STAGE</text>

  <!-- 西南角橡樹 -->
  <circle cx="95" cy="490" r="28" fill="#a9c98f" stroke="#7fa565" stroke-width="2"/>
  <text x="95" y="494" text-anchor="middle" font-size="12" fill="#3f5f33" font-style="italic">oak tree</text>

  <!-- 北側入口、西側停車場 -->
  <rect x="322" y="38" width="56" height="24" fill="#ffffff" stroke="#333" stroke-width="2"/>
  <text x="455" y="42" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">MAIN ENTRANCE</text>
  <text x="28" y="290" text-anchor="middle" font-size="13" fill="#666" font-style="italic" transform="rotate(-90 28 290)">car park</text>

  <!-- 指北針 -->
  <g transform="translate(672,110)">
    <line x1="0" y1="28" x2="0" y2="-18" stroke="#333" stroke-width="2.5"/>
    <polygon points="0,-28 -7,-12 7,-12" fill="#333"/>
    <text x="0" y="46" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">N</text>
  </g>

  <!-- 位置標記 A–H -->
  <g font-size="19" font-weight="bold" text-anchor="middle">
    <g><circle cx="415" cy="105" r="20" fill="#fff" stroke="#c0392b" stroke-width="2.5"/><text x="415" y="112" fill="#c0392b">A</text></g>
    <g><circle cx="285" cy="105" r="20" fill="#fff" stroke="#c0392b" stroke-width="2.5"/><text x="285" y="112" fill="#c0392b">B</text></g>
    <g><circle cx="90" cy="290" r="20" fill="#fff" stroke="#c0392b" stroke-width="2.5"/><text x="90" y="297" fill="#c0392b">C</text></g>
    <g><circle cx="460" cy="290" r="20" fill="#fff" stroke="#c0392b" stroke-width="2.5"/><text x="460" y="297" fill="#c0392b">D</text></g>
    <g><circle cx="350" cy="385" r="20" fill="#fff" stroke="#c0392b" stroke-width="2.5"/><text x="350" y="392" fill="#c0392b">E</text></g>
    <g><circle cx="160" cy="455" r="20" fill="#fff" stroke="#c0392b" stroke-width="2.5"/><text x="160" y="462" fill="#c0392b">F</text></g>
    <g><circle cx="560" cy="480" r="20" fill="#fff" stroke="#c0392b" stroke-width="2.5"/><text x="560" y="487" fill="#c0392b">G</text></g>
    <g><circle cx="100" cy="100" r="20" fill="#fff" stroke="#c0392b" stroke-width="2.5"/><text x="100" y="107" fill="#c0392b">H</text></g>
  </g>

  <text x="350" y="26" text-anchor="middle" font-size="18" font-weight="bold" fill="#222">ASHBOURNE SUMMER FESTIVAL</text>
</svg>
