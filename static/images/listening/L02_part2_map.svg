<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 580" width="100%" style="max-width:700px;font-family:Arial,Helvetica,sans-serif">
  <rect width="700" height="580" fill="#ffffff"/>

  <!-- 農場外框 -->
  <rect x="40" y="40" width="620" height="480" fill="#f6f8ee" stroke="#555" stroke-width="2"/>

  <!-- 西南方果園 -->
  <rect x="60" y="400" width="250" height="105" fill="#e3eed6" stroke="#9ab886" stroke-width="1.5" rx="6"/>
  <g fill="#a9c98f" stroke="#7fa565" stroke-width="1">
    <circle cx="85" cy="425" r="9"/><circle cx="125" cy="425" r="9"/><circle cx="245" cy="425" r="9"/><circle cx="285" cy="425" r="9"/>
    <circle cx="85" cy="480" r="9"/><circle cx="125" cy="480" r="9"/><circle cx="245" cy="480" r="9"/><circle cx="285" cy="480" r="9"/>
  </g>
  <text x="185" y="420" text-anchor="middle" font-size="14" fill="#5a7a4e" font-style="italic">orchard</text>

  <!-- 北方池塘 -->
  <ellipse cx="400" cy="105" rx="95" ry="45" fill="#cfe4f5" stroke="#6ba3d0" stroke-width="2"/>
  <text x="400" y="111" text-anchor="middle" font-size="16" fill="#2f6a9c" font-style="italic">POND</text>

  <!-- 主要步道：由西側入口往東 -->
  <line x1="40" y1="325" x2="620" y2="325" stroke="#b08a52" stroke-width="9" stroke-linecap="round"/>
  <!-- 往北到池塘的小徑 -->
  <line x1="360" y1="280" x2="360" y2="150" stroke="#b08a52" stroke-width="6" stroke-linecap="round"/>
  <!-- 東側往南的小徑 -->
  <line x1="580" y1="325" x2="580" y2="470" stroke="#b08a52" stroke-width="6" stroke-linecap="round"/>

  <!-- 農場院子 -->
  <rect x="300" y="280" width="130" height="90" fill="#efe3cc" stroke="#a08560" stroke-width="2"/>
  <text x="365" y="362" text-anchor="middle" font-size="13" font-weight="bold" fill="#6b5333">FARMYARD</text>

  <!-- 穀倉（院子北側） -->
  <rect x="320" y="215" width="90" height="55" fill="#d9b59a" stroke="#7a4f32" stroke-width="2"/>
  <text x="365" y="248" text-anchor="middle" font-size="14" font-weight="bold" fill="#5a3520">BARN</text>

  <!-- 西側入口 -->
  <rect x="28" y="300" width="24" height="50" fill="#ffffff" stroke="#333" stroke-width="2"/>
  <text x="18" y="325" text-anchor="middle" font-size="14" font-weight="bold" fill="#222" transform="rotate(-90 18 325)">ENTRANCE</text>

  <!-- 指北針 -->
  <g transform="translate(640,95)">
    <line x1="0" y1="28" x2="0" y2="-18" stroke="#333" stroke-width="2.5"/>
    <polygon points="0,-28 -7,-12 7,-12" fill="#333"/>
    <text x="0" y="46" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">N</text>
  </g>

  <!-- 位置標記 A–H -->
  <g font-size="19" font-weight="bold" text-anchor="middle">
    <g><circle cx="120" cy="270" r="20" fill="#fff" stroke="#c0392b" stroke-width="2.5"/><text x="120" y="277" fill="#c0392b">A</text></g>
    <g><circle cx="120" cy="375" r="20" fill="#fff" stroke="#c0392b" stroke-width="2.5"/><text x="120" y="382" fill="#c0392b">B</text></g>
    <g><circle cx="280" cy="242" r="20" fill="#fff" stroke="#c0392b" stroke-width="2.5"/><text x="280" y="249" fill="#c0392b">C</text></g>
    <g><circle cx="500" cy="285" r="20" fill="#fff" stroke="#c0392b" stroke-width="2.5"/><text x="500" y="292" fill="#c0392b">D</text></g>
    <g><circle cx="430" cy="178" r="20" fill="#fff" stroke="#c0392b" stroke-width="2.5"/><text x="430" y="185" fill="#c0392b">E</text></g>
    <g><circle cx="560" cy="75" r="20" fill="#fff" stroke="#c0392b" stroke-width="2.5"/><text x="560" y="82" fill="#c0392b">F</text></g>
    <g><circle cx="620" cy="480" r="20" fill="#fff" stroke="#c0392b" stroke-width="2.5"/><text x="620" y="487" fill="#c0392b">G</text></g>
    <g><circle cx="185" cy="465" r="20" fill="#fff" stroke="#c0392b" stroke-width="2.5"/><text x="185" y="472" fill="#c0392b">H</text></g>
  </g>

  <text x="350" y="26" text-anchor="middle" font-size="18" font-weight="bold" fill="#222">MILLBROOK CITY FARM</text>
</svg>
