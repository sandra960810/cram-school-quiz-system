<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 580" width="100%" style="max-width:700px;font-family:Arial,Helvetica,sans-serif">
  <rect width="700" height="580" fill="#ffffff"/>
  <rect x="20" y="36" width="660" height="534" fill="#e6f1fa" stroke="#9cc3e2" stroke-width="1.5" rx="8"/>

  <!-- 島 -->
  <path d="M350 55 C480 45 610 125 600 260 C605 300 560 330 585 365 C610 400 600 440 580 460 C540 510 450 525 350 520 C220 530 110 480 100 390 C70 300 90 180 160 120 C220 70 290 55 350 55 Z" fill="#f1f3e3" stroke="#8a8f6a" stroke-width="2.5"/>

  <!-- 西岸懸崖 -->
  <g stroke="#8a7a5c" stroke-width="2"><line x1="93" y1="215" x2="106" y2="218"/><line x1="89" y1="235" x2="102" y2="238"/><line x1="87" y1="255" x2="100" y2="258"/><line x1="86" y1="275" x2="99" y2="278"/><line x1="86" y1="295" x2="99" y2="298"/><line x1="87" y1="315" x2="100" y2="318"/><line x1="89" y1="335" x2="102" y2="338"/><line x1="92" y1="355" x2="105" y2="358"/></g>
  <text x="52" y="285" text-anchor="middle" font-size="13" fill="#6b5f45" font-style="italic" transform="rotate(-90 52 285)">cliffs</text>

  <!-- 中央山丘 -->
  <ellipse cx="350" cy="270" rx="85" ry="62" fill="none" stroke="#b9b48c" stroke-width="1.5"/>
  <ellipse cx="350" cy="270" rx="58" ry="42" fill="none" stroke="#b9b48c" stroke-width="1.5"/>
  <text x="350" y="350" text-anchor="middle" font-size="13" fill="#7c7750" font-style="italic">hill</text>

  <!-- 小路：碼頭往北，在岔路分成三條 -->
  <g fill="none" stroke="#b08a52" stroke-width="5" stroke-linecap="round" stroke-dasharray="2 9">
    <path d="M350 515 L350 430"/>
    <path d="M350 430 L350 100"/>
    <path d="M350 430 C280 400 200 350 150 290"/>
    <path d="M350 430 C430 410 500 390 540 355 C570 300 565 220 530 160"/>
  </g>

  <!-- 南端碼頭 -->
  <rect x="340" y="512" width="20" height="40" fill="#b08a52" stroke="#6b5333" stroke-width="2"/>
  <text x="410" y="550" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">JETTY</text>

  <!-- 指北針 -->
  <g transform="translate(645,90)">
    <line x1="0" y1="28" x2="0" y2="-18" stroke="#333" stroke-width="2.5"/>
    <polygon points="0,-28 -7,-12 7,-12" fill="#333"/>
    <text x="0" y="46" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">N</text>
  </g>

  <!-- 位置標記 A–H -->
  <g font-size="19" font-weight="bold" text-anchor="middle">
    <g><circle cx="350" cy="95" r="20" fill="#fff" stroke="#c0392b" stroke-width="2.5"/><text x="350" y="102" fill="#c0392b">A</text></g>
    <g><circle cx="525" cy="150" r="20" fill="#fff" stroke="#c0392b" stroke-width="2.5"/><text x="525" y="157" fill="#c0392b">B</text></g>
    <g><circle cx="548" cy="350" r="20" fill="#fff" stroke="#c0392b" stroke-width="2.5"/><text x="548" y="357" fill="#c0392b">C</text></g>
    <g><circle cx="350" cy="430" r="20" fill="#fff" stroke="#c0392b" stroke-width="2.5"/><text x="350" y="437" fill="#c0392b">D</text></g>
    <g><circle cx="350" cy="270" r="20" fill="#fff" stroke="#c0392b" stroke-width="2.5"/><text x="350" y="277" fill="#c0392b">E</text></g>
    <g><circle cx="190" cy="440" r="20" fill="#fff" stroke="#c0392b" stroke-width="2.5"/><text x="190" y="447" fill="#c0392b">F</text></g>
    <g><circle cx="140" cy="285" r="20" fill="#fff" stroke="#c0392b" stroke-width="2.5"/><text x="140" y="292" fill="#c0392b">G</text></g>
    <g><circle cx="490" cy="465" r="20" fill="#fff" stroke="#c0392b" stroke-width="2.5"/><text x="490" y="472" fill="#c0392b">H</text></g>
  </g>

  <text x="350" y="26" text-anchor="middle" font-size="18" font-weight="bold" fill="#222">SKERRY ISLAND</text>
</svg>
