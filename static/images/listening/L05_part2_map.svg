<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 580" width="100%" style="max-width:700px;font-family:Arial,Helvetica,sans-serif">
  <rect width="700" height="580" fill="#ffffff"/>

  <!-- 建築外框 -->
  <rect x="60" y="60" width="580" height="460" fill="#e9e4d8" stroke="#333" stroke-width="3"/>

  <!-- 大廳 -->
  <rect x="240" y="190" width="220" height="200" fill="#efe3cc" stroke="#555" stroke-width="2"/>
  <text x="350" y="350" text-anchor="middle" font-size="15" font-weight="bold" fill="#6b5333">MAIN HALL</text>

  <!-- 西側三間 -->
  <rect x="60" y="60" width="180" height="150" fill="#f4f1ea" stroke="#555" stroke-width="2"/>
  <rect x="60" y="210" width="180" height="160" fill="#f4f1ea" stroke="#555" stroke-width="2"/>
  <rect x="60" y="370" width="180" height="150" fill="#f4f1ea" stroke="#555" stroke-width="2"/>

  <!-- 大廳北側、南側 -->
  <rect x="240" y="60" width="220" height="130" fill="#f4f1ea" stroke="#555" stroke-width="2"/>
  <rect x="240" y="390" width="220" height="130" fill="#f4f1ea" stroke="#555" stroke-width="2"/>

  <!-- 東側：入口走道北邊一間、南邊兩間 -->
  <rect x="460" y="60" width="180" height="190" fill="#f4f1ea" stroke="#555" stroke-width="2"/>
  <rect x="460" y="330" width="90" height="190" fill="#f4f1ea" stroke="#555" stroke-width="2"/>
  <rect x="550" y="330" width="90" height="190" fill="#f4f1ea" stroke="#555" stroke-width="2"/>

  <!-- 東側入口 -->
  <rect x="628" y="262" width="24" height="56" fill="#ffffff" stroke="#333" stroke-width="2"/>
  <text x="676" y="290" text-anchor="middle" font-size="14" font-weight="bold" fill="#222" transform="rotate(90 676 290)">ENTRANCE</text>

  <!-- 指北針 -->
  <g transform="translate(672,95)">
    <line x1="0" y1="28" x2="0" y2="-18" stroke="#333" stroke-width="2.5"/>
    <polygon points="0,-28 -7,-12 7,-12" fill="#333"/>
    <text x="0" y="46" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">N</text>
  </g>

  <!-- 位置標記 A–H -->
  <g font-size="19" font-weight="bold" text-anchor="middle">
    <g><circle cx="550" cy="155" r="20" fill="#fff" stroke="#c0392b" stroke-width="2.5"/><text x="550" y="162" fill="#c0392b">A</text></g>
    <g><circle cx="595" cy="425" r="20" fill="#fff" stroke="#c0392b" stroke-width="2.5"/><text x="595" y="432" fill="#c0392b">B</text></g>
    <g><circle cx="350" cy="125" r="20" fill="#fff" stroke="#c0392b" stroke-width="2.5"/><text x="350" y="132" fill="#c0392b">C</text></g>
    <g><circle cx="350" cy="455" r="20" fill="#fff" stroke="#c0392b" stroke-width="2.5"/><text x="350" y="462" fill="#c0392b">D</text></g>
    <g><circle cx="150" cy="135" r="20" fill="#fff" stroke="#c0392b" stroke-width="2.5"/><text x="150" y="142" fill="#c0392b">E</text></g>
    <g><circle cx="150" cy="290" r="20" fill="#fff" stroke="#c0392b" stroke-width="2.5"/><text x="150" y="297" fill="#c0392b">F</text></g>
    <g><circle cx="150" cy="445" r="20" fill="#fff" stroke="#c0392b" stroke-width="2.5"/><text x="150" y="452" fill="#c0392b">G</text></g>
    <g><circle cx="505" cy="425" r="20" fill="#fff" stroke="#c0392b" stroke-width="2.5"/><text x="505" y="432" fill="#c0392b">H</text></g>
  </g>

  <text x="350" y="26" text-anchor="middle" font-size="18" font-weight="bold" fill="#222">CASTLEGATE MUSEUM – GROUND FLOOR</text>
</svg>
