<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 580" width="100%" style="max-width:700px;font-family:Arial,Helvetica,sans-serif">
  <rect width="700" height="580" fill="#ffffff"/>
  <!-- 河流 -->
  <path d="M20 500 C200 488 500 512 680 496 L680 560 L20 560 Z" fill="#e6f1fa" stroke="#9cc3e2" stroke-width="1.5"/>
  <text x="600" y="540" text-anchor="middle" font-size="13" fill="#4a7ea8" font-style="italic">River Ash</text>
  <!-- 街道 -->
  <g fill="none" stroke="#d7cfc0" stroke-width="22" stroke-linecap="round">
    <path d="M40 260 L660 260"/>
    <path d="M350 250 L350 105"/>
    <path d="M350 270 L350 500"/>
    <path d="M60 470 L640 470" stroke-width="4" stroke-dasharray="3 7" stroke="#b08a52"/>
  </g>
  <!-- 市集廣場 -->
  <rect x="270" y="205" width="160" height="110" fill="#f3efe3" stroke="#a89f86" stroke-width="2"/>
  <text x="350" y="300" text-anchor="middle" font-size="12" fill="#6b6450">MARKET SQUARE</text>
  <circle cx="350" cy="255" r="7" fill="#a89f86"/>
  <text x="350" y="242" text-anchor="middle" font-size="10" fill="#6b6450">market cross</text>
  <!-- 橋 -->
  <rect x="330" y="484" width="40" height="34" fill="#c9b79a" stroke="#6b5333" stroke-width="2"/>
  <text x="395" y="530" font-size="12" fill="#333">bridge</text>
  <!-- 教堂 -->
  <rect x="320" y="58" width="60" height="40" fill="#eee" stroke="#555" stroke-width="2"/>
  <path d="M350 58 L350 42 M343 48 L357 48" stroke="#555" stroke-width="2"/>
  <text x="392" y="82" font-size="12" fill="#333">St Mary's Church</text>
  <!-- 街名 -->
  <text x="110" y="250" font-size="12" fill="#555">HIGH STREET</text>
  <text x="560" y="250" font-size="12" fill="#555">HIGH STREET</text>
  <text x="374" y="205" font-size="12" fill="#555" transform="rotate(-90 374 205)">CHURCH LANE</text>
  <text x="372" y="420" font-size="12" fill="#555" transform="rotate(-90 372 420)">BRIDGE STREET</text>
  <text x="560" y="462" font-size="11" fill="#7a6040">riverside path</text>
  <!-- 起點 -->
  <rect x="230" y="318" width="70" height="26" fill="#222" rx="4"/>
  <text x="265" y="336" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">START</text>
  <!-- 指北針 -->
  <g transform="translate(645,90)">
    <line x1="0" y1="28" x2="0" y2="-18" stroke="#333" stroke-width="2.5"/>
    <polygon points="0,-28 -7,-12 7,-12" fill="#333"/>
    <text x="0" y="46" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">N</text>
  </g>
  <g font-size="19" font-weight="bold" text-anchor="middle">
    <g><circle cx="170" cy="220" r="20" fill="#fff" stroke="#c0392b" stroke-width="2.5"/><text x="170" y="227" fill="#c0392b">A</text></g>
    <g><circle cx="305" cy="165" r="20" fill="#fff" stroke="#c0392b" stroke-width="2.5"/><text x="305" y="172" fill="#c0392b">B</text></g>
    <g><circle cx="395" cy="130" r="20" fill="#fff" stroke="#c0392b" stroke-width="2.5"/><text x="395" y="137" fill="#c0392b">C</text></g>
    <g><circle cx="465" cy="215" r="20" fill="#fff" stroke="#c0392b" stroke-width="2.5"/><text x="465" y="222" fill="#c0392b">D</text></g>
    <g><circle cx="590" cy="300" r="20" fill="#fff" stroke="#c0392b" stroke-width="2.5"/><text x="590" y="307" fill="#c0392b">E</text></g>
    <g><circle cx="305" cy="435" r="20" fill="#fff" stroke="#c0392b" stroke-width="2.5"/><text x="305" y="442" fill="#c0392b">F</text></g>
    <g><circle cx="480" cy="440" r="20" fill="#fff" stroke="#c0392b" stroke-width="2.5"/><text x="480" y="447" fill="#c0392b">G</text></g>
    <g><circle cx="190" cy="440" r="20" fill="#fff" stroke="#c0392b" stroke-width="2.5"/><text x="190" y="447" fill="#c0392b">H</text></g>
  </g>
  <text x="350" y="26" text-anchor="middle" font-size="18" font-weight="bold" fill="#222">ASHBURY OLD TOWN</text>
</svg>
