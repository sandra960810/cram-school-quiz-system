<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 580" width="100%" style="max-width:700px;font-family:Arial,Helvetica,sans-serif">
  <rect width="700" height="580" fill="#ffffff"/>
  <!-- 園區外框 -->
  <rect x="50" y="50" width="600" height="490" fill="#f1f6ea" stroke="#7a9a5c" stroke-width="3" rx="10"/>
  <!-- 湖 -->
  <ellipse cx="520" cy="320" rx="95" ry="70" fill="#e6f1fa" stroke="#9cc3e2" stroke-width="2"/>
  <text x="520" y="325" text-anchor="middle" font-size="13" fill="#4a7ea8" font-style="italic">lake</text>
  <!-- 樹林步道 -->
  <g fill="#c9dbb4" stroke="#9ab57e"><circle cx="130" cy="200" r="16"/><circle cx="160" cy="185" r="14"/><circle cx="110" cy="225" r="13"/><circle cx="150" cy="220" r="15"/></g>
  <text x="140" y="255" text-anchor="middle" font-size="11" fill="#55703a" font-style="italic">woodland walk</text>
  <!-- 步道 -->
  <g fill="none" stroke="#c7b08a" stroke-width="10" stroke-linecap="round">
    <path d="M350 535 L350 110"/>
    <path d="M350 500 C280 495 200 490 150 470"/>
    <path d="M150 470 L130 290"/>
    <path d="M350 300 C410 300 430 250 470 240"/>
  </g>
  <!-- 中央草坪 -->
  <rect x="380" y="380" width="1" height="1" fill="none"/>
  <text x="260" y="360" text-anchor="middle" font-size="12" fill="#55703a" font-style="italic">lawn</text>
  <!-- 正門 -->
  <rect x="320" y="528" width="60" height="20" fill="#222" rx="3"/>
  <text x="350" y="568" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">MAIN GATE</text>
  <text x="350" y="85" text-anchor="middle" font-size="11" fill="#666">main path</text>
  <!-- 指北針 -->
  <g transform="translate(672,95)">
    <line x1="0" y1="24" x2="0" y2="-14" stroke="#333" stroke-width="2.5"/>
    <polygon points="0,-24 -6,-10 6,-10" fill="#333"/>
    <text x="0" y="40" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">N</text>
  </g>
  <g font-size="19" font-weight="bold" text-anchor="middle">
    <g><circle cx="110" cy="110" r="20" fill="#fff" stroke="#c0392b" stroke-width="2.5"/><text x="110" y="117" fill="#c0392b">A</text></g>
    <g><circle cx="350" cy="120" r="20" fill="#fff" stroke="#c0392b" stroke-width="2.5"/><text x="350" y="127" fill="#c0392b">B</text></g>
    <g><circle cx="520" cy="225" r="20" fill="#fff" stroke="#c0392b" stroke-width="2.5"/><text x="520" y="232" fill="#c0392b">C</text></g>
    <g><circle cx="600" cy="400" r="20" fill="#fff" stroke="#c0392b" stroke-width="2.5"/><text x="600" y="407" fill="#c0392b">D</text></g>
    <g><circle cx="440" cy="500" r="20" fill="#fff" stroke="#c0392b" stroke-width="2.5"/><text x="440" y="507" fill="#c0392b">E</text></g>
    <g><circle cx="260" cy="320" r="20" fill="#fff" stroke="#c0392b" stroke-width="2.5"/><text x="260" y="327" fill="#c0392b">F</text></g>
    <g><circle cx="110" cy="360" r="20" fill="#fff" stroke="#c0392b" stroke-width="2.5"/><text x="110" y="367" fill="#c0392b">G</text></g>
    <g><circle cx="110" cy="490" r="20" fill="#fff" stroke="#c0392b" stroke-width="2.5"/><text x="110" y="497" fill="#c0392b">H</text></g>
  </g>
  <text x="350" y="26" text-anchor="middle" font-size="18" font-weight="bold" fill="#222">WESTMERE BOTANIC GARDEN</text>
</svg>
