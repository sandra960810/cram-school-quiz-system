<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ '單字複習' if mode == 'review' else '單字學習' }}｜{{ theme.label }}</title>
    <style>
        body { font-family: "Microsoft JhengHei", Arial, sans-serif; background-color: #f4f7f6; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box; }
        .card { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 400px; max-width: 100%; text-align: center; }
        .theme-badge { display: inline-block; background-color: #e8f4f8; color: #2980b9; padding: 5px 12px; border-radius: 15px; font-size: 12px; font-weight: bold; margin-bottom: 15px; }
        .mode-badge { display: inline-block; padding: 5px 12px; border-radius: 15px; font-size: 12px; font-weight: bold; margin-bottom: 15px; margin-left: 5px; }
        .mode-new { background: #eaf2fb; color: #2471a3; }
        .mode-review { background: #e9f7ef; color: #1e8449; }
        .word-row { display: flex; justify-content: center; align-items: center; gap: 10px; margin-bottom: 10px; }
        .word { font-size: 36px; font-weight: bold; color: #2c3e50; word-break: break-word; }
        .play-btn { flex: none; width: 36px; height: 36px; border-radius: 50%; border: none; background: #e8f4f8; color: #2980b9; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; padding: 0; transition: 0.2s; }
        .play-btn:hover { background: #3498db; color: white; }
        .play-btn.small { width: 30px; height: 30px; }
        .play-btn.small svg { width: 16px; height: 16px; }
        .pos { font-size: 14px; color: #95a5a6; font-style: italic; margin-bottom: 6px; min-height: 1em; }
        .meaning { font-size: 20px; color: #7f8c8d; margin-bottom: 6px; }
        .meaning-en { font-size: 14px; color: #95a5a6; margin-bottom: 20px; line-height: 1.4; }
        .sentence-zh { display: block; font-style: normal; color: #7f8c8d; font-size: 14px; margin-top: 6px; }
        .sentence { display: flex; align-items: center; gap: 10px; text-align: left; font-size: 16px; color: #34495e; background: #f9f9f9; padding: 15px; border-radius: 8px; margin-bottom: 20px; border-left: 4px solid #bdc3c7; }
        .sentence-body { flex: 1; }
        #sentence-text { font-style: italic; }

        .btn { padding: 12px 20px; font-size: 16px; border: none; border-radius: 8px; cursor: pointer; margin: 5px 0; font-weight: bold; transition: 0.2s; }
        .btn:hover { opacity: 0.9; }
        .btn:disabled { opacity: 0.5; cursor: wait; }
        .btn-next { background: #3498db; color: white; width: 100%; font-size: 18px; padding: 15px; margin-top: 10px; display: block; text-decoration: none; box-sizing: border-box; }
        .btn-secondary { background: #ecf0f1; color: #2c3e50; width: 100%; display: block; text-decoration: none; box-sizing: border-box; }
        .progress { margin-top: 20px; font-size: 14px; color: #95a5a6; }
        .error { color: #c0392b; font-size: 14px; margin-top: 10px; min-height: 1em; }
        .back-link { display: block; margin-top: 15px; color: #95a5a6; text-decoration: none; font-size: 14px; }
    </style>
</head>
<body>

<div class="card">
    <div>
        <span id="theme-display" class="theme-badge">🏷️ {{ theme.label }}{% if letter %}・{{ letter }}{% endif %}</span>
        <span class="mode-badge {{ 'mode-review' if mode == 'review' else 'mode-new' }}">{{ '🔁 複習' if mode == 'review' else '✨ 新單字' }}</span>
    </div>
    <div class="word-row">
        <span id="word-display" class="word">單字載入中...</span>
        <button class="play-btn" onclick="playWord()" title="播放單字" aria-label="播放單字"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 7.97v8.05A4.5 4.5 0 0 0 16.5 12zM14 3.23v2.06a7 7 0 0 1 0 13.42v2.06A9 9 0 0 0 14 3.23z"/></svg></button>
    </div>
    <div id="pos-display" class="pos"></div>
    <div id="meaning-display" class="meaning"></div>
    <div id="meaning-en-display" class="meaning-en"></div>

    <div id="sentence-display" class="sentence">
        <div class="sentence-body"><span id="sentence-text"></span><span id="sentence-zh" class="sentence-zh"></span></div>
        <button class="play-btn small" onclick="playSentence()" title="播放例句" aria-label="播放例句"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 7.97v8.05A4.5 4.5 0 0 0 16.5 12zM14 3.23v2.06a7 7 0 0 1 0 13.42v2.06A9 9 0 0 0 14 3.23z"/></svg></button>
    </div>

    <button class="btn btn-next" id="next-btn" onclick="nextWord()">
        {{ '➔ 下一個' if mode == 'review' else '✅ 記住了，收進圖鑑' }}
    </button>
    <div id="error-display" class="error"></div>

    <div id="progress-display" class="progress">進度：0 / 0</div>
    <a href="{{ back_url }}" class="back-link">返回主題圖鑑</a>
</div>

<script>
    const wordsQueue = {{ words | tojson }};
    const studentId = {{ student_id | tojson }};
    const mode = {{ mode | tojson }};
    const backUrl = {{ back_url | tojson }};
    const againUrl = {{ again_url | tojson }};
    const homeUrl = {{ home_url | tojson }};
    const totalWords = wordsQueue.length;
    let currentWord = null;
    let completedCount = 0;

    function finish(title) {
        const again = totalWords
            ? `<a href="${againUrl}" class="btn btn-next">${mode === 'review' ? '🔁 再複習一輪' : '▶ 再學下一批'}</a>`
            : '';
        document.querySelector('.card').innerHTML = `
            <h2 style="color: #2c3e50; margin-bottom: 30px;">${title}</h2>
            ${again}
            <a href="${backUrl}" class="btn btn-secondary">📖 回到主題圖鑑</a>
            <a href="${homeUrl}" class="btn btn-secondary">🔙 選擇其他主題</a>
        `;
    }

    function loadWord() {
        if (wordsQueue.length === 0) {
            if (totalWords === 0) {
                finish(mode === 'review' ? '這裡還沒有已解鎖的單字，<br>先去學幾個新單字吧！' : '🎉 這裡的單字都收進圖鑑了！');
            } else {
                finish(mode === 'review' ? `🎉 複習完成！<br>本輪複習了 ${totalWords} 個單字。` : `🎉 學習完成！<br>${totalWords} 個單字已收進圖鑑。`);
            }
            return;
        }

        currentWord = wordsQueue.shift();
        document.getElementById('word-display').innerText = currentWord.word;
        document.getElementById('pos-display').innerText = currentWord.pos || '';
        document.getElementById('meaning-display').innerText = currentWord.meaning;
        document.getElementById('meaning-en-display').innerText = currentWord.meaning_en || '';
        const sentenceBox = document.getElementById('sentence-display');
        if (currentWord.sentence) {
            document.getElementById('sentence-text').innerText = currentWord.sentence;
            document.getElementById('sentence-zh').innerText = currentWord.sentence_zh || '';
            sentenceBox.style.display = '';
        } else {
            sentenceBox.style.display = 'none';
        }
        document.getElementById('progress-display').innerText = `目前進度：${completedCount + 1} / ${totalWords}`;
    }

    // 學習模式：按下去才把這個字解鎖進圖鑑；複習模式：字已經在圖鑑裡，只更新複習時間
    async function nextWord() {
        if (!currentWord) return;
        const btn = document.getElementById('next-btn');
        const err = document.getElementById('error-display');
        btn.disabled = true;
        err.innerText = '';
        try {
            const res = await fetch('/api/update_progress', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ student_id: studentId, vocab_id: currentWord.id, status: 'familiar' })
            });
            if (!res.ok) throw new Error(res.status);
        } catch (e) {
            err.innerText = '進度沒有存到，請檢查網路後再按一次。';
            btn.disabled = false;
            return;
        }
        btn.disabled = false;
        completedCount++;
        loadWord();
    }

    function speak(text) {
        if (!text || !window.speechSynthesis) return;
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'en-US';
        window.speechSynthesis.speak(utterance);
    }
    function playWord() { if (currentWord) speak(currentWord.word); }
    function playSentence() { if (currentWord) speak(currentWord.sentence); }

    window.onload = loadWord;
</script>

</body>
</html>
