<!DOCTYPE html>
<html lang="zh-TW" data-exam="ielts">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}學生登入{% endblock %}｜測驗系統</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='theme.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='ui.css') }}">
    <style>
        body { font-family: var(--font); background: var(--bg); margin: 0; padding: 40px 16px 80px; color: var(--ink); }
        .wrap { max-width: 520px; margin: 0 auto; }
        .hero { background: var(--hero); color: var(--hero-ink); padding: 24px 26px; border-radius: 15px; box-shadow: var(--edge-hero); margin-bottom: 20px; }
        .hero h1 { margin: 0 0 6px; font-size: 24px; display: flex; align-items: center; gap: 8px; }
        .hero p { margin: 0; line-height: 1.6; opacity: .92; }
        .panel { background: #fff; border-radius: 14px; box-shadow: var(--edge); padding: 22px; margin-bottom: 16px; }
        label.f { display: block; font-weight: bold; font-size: 15px; margin: 16px 0 6px; }
        label.f:first-child { margin-top: 0; }
        label.f .req { color: var(--bad); }
        .tip { font-weight: normal; color: var(--muted); font-size: 13px; line-height: 1.5; margin: 6px 0 0; }
        .tip.key { color: var(--warn-ink); background: var(--warn-50); border-radius: 8px; padding: 6px 10px; }
        input[type=text], input[type=password], input[type=email], input[type=tel], select {
            width: 100%; box-sizing: border-box; padding: 11px 12px; border: 2px solid var(--line); border-radius: 10px;
            font: inherit; font-size: 16px; background: #fff; color: var(--ink); }
        input:focus, select:focus { outline: none; border-color: var(--primary); }
        .checks { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .checks label { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border: 2px solid var(--line); border-radius: 10px; cursor: pointer; font-size: 15px; }
        .checks label:has(input:checked) { border-color: var(--primary); background: var(--primary-50); color: var(--primary); font-weight: bold; }
        .checks input { width: 18px; height: 18px; accent-color: var(--primary); }
        .btn { display: flex; width: 100%; justify-content: center; align-items: center; gap: 6px; margin-top: 22px; padding: 13px 18px; border-radius: 10px; border: none; cursor: pointer; font: inherit; font-weight: bold; font-size: 17px; background: var(--primary); color: #fff; box-shadow: var(--edge-raised); text-decoration: none; box-sizing: border-box; }
        .btn:hover { filter: brightness(1.06); }
        .btn.ghost { background: #fff; color: var(--primary); box-shadow: 0 0 0 2px var(--primary-300); }
        .err { background: var(--bad-50); color: var(--bad-ink); border-radius: 12px; padding: 12px 16px; margin-bottom: 14px; line-height: 1.6; font-size: 15px; }
        .err ul { margin: 0; padding-left: 20px; }
        .links { text-align: center; margin-top: 18px; font-size: 15px; color: var(--muted); }
        .links a { color: var(--primary); font-weight: bold; text-decoration: none; }
        .small-links { text-align: center; margin-top: 30px; font-size: 13px; }
        .small-links a { color: var(--muted-2); text-decoration: none; }
        @media (max-width: 480px) { .checks { grid-template-columns: 1fr; } .hero { padding: 18px; } .hero h1 { font-size: 21px; } .panel { padding: 18px; } }
    </style>
    {% block head %}{% endblock %}
</head>
<body>
<div class="wrap">
{% block body %}{% endblock %}
</div>
<script src="{{ url_for('static', filename='ui.js') }}"></script>
</body>
</html>
