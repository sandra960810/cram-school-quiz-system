<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>選擇單字主題</title>
    <style>
        body { font-family: "Microsoft JhengHei", Arial, sans-serif; background-color: #f4f7f6; display: flex; flex-direction: column; align-items: center; padding: 40px 20px; margin: 0; }
        .header { margin-bottom: 30px; text-align: center; color: #2c3e50; }
        
        /* 改用 Grid 網格排版，讓 10 個主題可以整齊排列 */
        .theme-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; width: 100%; max-width: 1000px; }
        
        .theme-card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); text-decoration: none; color: inherit; display: flex; align-items: flex-start; transition: 0.2s; border-left: 6px solid #3498db; }
        .theme-card:hover { transform: translateY(-5px); box-shadow: 0 6px 15px rgba(0,0,0,0.1); }
        
        .theme-icon { font-size: 32px; margin-right: 15px; }
        .theme-content { flex: 1; }
        .theme-title { font-size: 18px; font-weight: bold; margin-bottom: 5px; color: #2c3e50; }
        .theme-desc { font-size: 13px; color: #7f8c8d; line-height: 1.4; }
        .back-btn { margin-top: 30px; color: #3498db; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>

    <div class="header">
        <h1>📚 {{ student.enrolled_course }} 核心主題字庫</h1>
        <p>請選擇你想複習的領域主題</p>
    </div>

    <div class="theme-grid">
        {% for theme in themes %}
            <a href="/vocab/{{ student.id }}/{{ theme.id }}" class="theme-card">
                <div class="theme-icon">{{ theme.icon }}</div>
                <div class="theme-content">
                    <div class="theme-title">{{ theme.name }}</div>
                    <div class="theme-desc">{{ theme.desc }}</div>
                </div>
            </a>
        {% endfor %}
    </div>

    <a href="/dashboard/{{ student.id }}" class="back-btn">🔙 返回主介面</a>

</body>
</html>
