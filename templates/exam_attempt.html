<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>作答中｜{{ attempt.scope_label }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='ui.css') }}">
    <style>
        body { font-family: "Microsoft JhengHei", Arial, sans-serif; background-color: #f0f2f5; margin: 0; padding: 20px; }
        .container { max-width: 560px; margin: 0 auto; }
        .progress-text { display: flex; justify-content: space-between; font-size: 13px; color: #7f8c8d; margin-bottom: 6px; }
        .progress-bar { height: 8px; background: #e5e8e8; border-radius: 6px; overflow: hidden; display: flex; margin-bottom: 16px; }
        .progress-bar .ok { background: #2ecc71; transition: width 0.3s; }
        .progress-bar .no { background: #e74c3c; transition: width 0.3s; }

        .qcard { background: white; border-radius: 15px; box-shadow: 0 6px 16px rgba(0,0,0,0.08); padding: 24px; }
        @keyframes q-in { from { opacity: 0; transform: translateX(30px); } to { opacity: 1; transform: none; } }
        .qcard.enter { animation: q-in 0.28s ease-out; }
        .qtype { display: inline-block; background: #ede7f6; color: #5b48a2; font-size: 12px; font-weight: bold; padding: 4px 12px; border-radius: 12px; margin-bottom: 12px; }
        .prompt { font-size: 19px; color: #2c3e50; font-weight: bold; margin-bottom: 6px; }
        .hint { font-size: 14px; color: #95a5a6; margin-bottom: 10px; }
        .sentence-box { background: #f9f9f9; border-left: 4px solid #bdc3c7; border-radius: 8px; padding: 13px; font-size: 16px; color: #34495e; font-style: italic; margin: 10px 0; }
        .sentence-box .zh { display: block; font-style: normal; font-size: 13px; color: #95a5a6; margin-top: 5px; }
        .speak-btn { display: inline-flex; align-items: center; gap: 8px; border: none; background: #e8f4f8; color: #2980b9; font-size: 15px; font-weight: bold; border-radius: 999px; padding: 10px 18px; cursor: pointer; margin: 6px 0 10px; font-family: inherit; }
        .speak-btn:hover { background: #3498db; color: white; }

        .options { display: grid; gap: 10px; margin-top: 14px; }
        .opt { text-align: left; border: 2px solid #e5e8e8; background: white; border-radius: 10px; padding: 13px 15px; font-size: 16px; color: #2c3e50; cursor: pointer; font-family: inherit; transition: 0.15s; }
        .opt:hover { border-color: #5b48a2; background: #f7f5fb; }
        .opt.picked-right { border-color: #2ecc71; background: #d5f5e3; font-weight: bold; }
        .opt.picked-wrong { border-color: #e74c3c; background: #fadbd8; }
        .opt.reveal { border-color: #2ecc71; background: #f0fbf4; }
        .opt:disabled { cursor: default; }

        .spell-row { display: flex; gap: 10px; margin-top: 14px; }
        .spell-input { flex: 1; padding: 13px; font-size: 18px; border: 2px solid #bdc3c7; border-radius: 10px; font-family: inherit; }
        .spell-input:focus { outline: none; border-color: #5b48a2; }
        .spell-input.right { border-color: #2ecc71; background: #f0fbf4; }
        .spell-input.wrong { border-color: #e74c3c; background: #fdf3f2; }
        .submit-btn { border: none; background: #5b48a2; color: white; font-weight: bold; font-size: 16px; border-radius: 10px; padding: 0 22px; cursor: pointer; font-family: inherit; }
        .submit-btn:disabled { opacity: 0.5; }

        .feedback { margin-top: 16px; border-radius: 10px; padding: 14px 16px; font-size: 15px; display: none; }
        .feedback.right { background: #d5f5e3; color: #1e8449; }
        .feedback.wrong { background: #fadbd8; color: #c0392b; }
        .feedback .detail { color: #2c3e50; font-size: 14px; margin-top: 8px; font-weight: normal; }
        .feedback .detail i { color: #7f8c8d; }
        .next-btn { display: none; width: 100%; box-sizing: border-box; margin-top: 14px; border: none; background: #3498db; color: white; font-size: 17px; font-weight: bold; padding: 14px; border-radius: 10px; cursor: pointer; font-family: inherit; }
        .err { color: #c0392b; font-size: 14px; margin-top: 10px; min-height: 1em; }
    </style>
</head>
<body>
<div class="container">
    <div class="nav-row">
        <a href="{{ url_for('exam_setup', student_id=student.id) }}" class="nav-back"
           onclick="return confirm('要離開測驗嗎？已作答的題目會保留。')"><span class="arrow">←</span>離開測驗</a>
        <span class="nav-back" style="pointer-events:none">📝 {{ attempt.scope_label }}</span>
    </div>

    <div class="progress-text"><span id="pnum">1 / {{ questions|length }}</span><span>答對 <b id="okn" style="color:#27ae60">0</b>・答錯 <b id="non" style="color:#c0392b">0</b></span></div>
    <div class="progress-bar"><div class="ok" id="okbar" style="width:0"></div><div class="no" id="nobar" style="width:0"></div></div>

    <div class="qcard" id="qcard"></div>
    <div class="err" id="err"></div>
</div>

<script src="{{ url_for('static', filename='ui.js') }}"></script>
<script>
    const questions = {{ questions | tojson }}.filter(q => !q.done);
    const total = {{ questions|length }};
    // 重新整理時，已作答的題目不會再出現，只算進進度
    const answeredBefore = {{ questions | selectattr('done') | list | length }};
    let idx = 0, okn = 0, non = 0;
    const card = document.getElementById('qcard');
    let current = null, answered = false;

    function esc(t) { const d = document.createElement('div'); d.innerText = t ?? ''; return d.innerHTML; }

    function speak(text) {
        if (!text || !window.speechSynthesis) return;
        window.speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(text);
        u.lang = 'en-US'; u.rate = 0.9;
        window.speechSynthesis.speak(u);
    }

    function updateBar() {
        const done = answeredBefore + okn + non;
        document.getElementById('pnum').innerText = `${Math.min(done + 1, total)} / ${total}`;
        document.getElementById('okn').innerText = okn;
        document.getElementById('non').innerText = non;
        document.getElementById('okbar').style.width = (okn / total * 100) + '%';
        document.getElementById('nobar').style.width = (non / total * 100) + '%';
    }

    function render() {
        if (idx >= questions.length) {
            location.href = "{{ url_for('exam_result', student_id=student.id, attempt_id=attempt.id) }}";
            return;
        }
        current = questions[idx];
        answered = false;
        updateBar();
        let html = `<span class="qtype">${esc(current.qtype_name)}</span>
                    <div class="prompt">${esc(current.prompt)}</div>`;
        if (current.hint) html += `<div class="hint">提示：${esc(current.hint)}</div>`;
        if (current.speak) html += `<button class="speak-btn" data-sound="none" onclick="speak('${esc(current.speak).replace(/'/g, "\\'")}')">🔊 播放發音${current.qtype === 'listen_spell' ? '（可重複播放）' : ''}</button>`;
        if (current.sentence) html += `<div class="sentence-box">${esc(current.sentence)}${current.sentence_zh ? `<span class="zh">${esc(current.sentence_zh)}</span>` : ''}</div>`;
        if (current.input) {
            html += `<div class="spell-row">
                        <input class="spell-input" id="spell" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="輸入單字後按 Enter">
                        <button class="submit-btn" id="spell-go" data-sound="none">送出</button>
                     </div>`;
        } else {
            html += `<div class="options">` + current.options.map(o =>
                `<button class="opt" data-sound="none">${esc(o)}</button>`).join('') + `</div>`;
        }
        html += `<div class="feedback" id="fb"></div><button class="next-btn" id="next" data-sound="nav">下一題 →</button>`;
        card.innerHTML = html;
        card.classList.remove('enter'); void card.offsetWidth; card.classList.add('enter');

        if (current.input) {
            const input = document.getElementById('spell');
            input.focus();
            input.addEventListener('keydown', e => { if (e.key === 'Enter') submit(input.value); });
            document.getElementById('spell-go').addEventListener('click', () => submit(input.value));
        } else {
            card.querySelectorAll('.opt').forEach(btn => btn.addEventListener('click', () => submit(btn.innerText, btn)));
        }
        document.getElementById('next').addEventListener('click', () => { idx++; render(); });
        if (current.qtype === 'listen_spell') setTimeout(() => speak(current.speak), 400);
    }

    async function submit(answer, btn) {
        if (answered || !String(answer || '').trim()) return;
        answered = true;
        document.getElementById('err').innerText = '';
        let res, data;
        try {
            res = await fetch('/api/exam/answer', {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ qid: current.qid, answer: String(answer).trim() })
            });
            if (!res.ok) throw new Error(res.status);
            data = await res.json();
        } catch (e) {
            answered = false;
            UI.play('error');
            document.getElementById('err').innerText = '答案沒有送出，請檢查網路後再試一次。';
            return;
        }
        if (data.correct) { okn++; UI.play('right'); } else { non++; UI.play('left'); }
        updateBar();

        if (current.input) {
            const input = document.getElementById('spell');
            input.disabled = true;
            input.classList.add(data.correct ? 'right' : 'wrong');
            document.getElementById('spell-go').disabled = true;
        } else {
            card.querySelectorAll('.opt').forEach(b => {
                b.disabled = true;
                const isAnswer = b.innerText.trim().toLowerCase() === data.answer.trim().toLowerCase();
                if (b === btn) b.classList.add(data.correct ? 'picked-right' : 'picked-wrong');
                else if (isAnswer) b.classList.add('reveal');
            });
        }
        const fb = document.getElementById('fb');
        fb.className = 'feedback ' + (data.correct ? 'right' : 'wrong');
        fb.style.display = 'block';
        fb.innerHTML = (data.correct ? '✅ 答對了！' : `❌ 答錯了，正確答案：<b>${esc(data.answer)}</b>（已加入錯題本）`)
            + `<div class="detail"><b>${esc(data.word)}</b> ${esc(data.meaning)}`
            + (data.sentence ? `<br><i>${esc(data.sentence)}</i>${data.sentence_zh ? '<br>' + esc(data.sentence_zh) : ''}` : '')
            + `</div>`;
        const next = document.getElementById('next');
        next.style.display = 'block';
        next.innerText = (idx + 1 >= questions.length) ? '看成績 →' : '下一題 →';
        next.focus();
    }

    render();
</script>
</body>
</html>
