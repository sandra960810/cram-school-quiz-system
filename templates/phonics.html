<!DOCTYPE html>
<html lang="zh-TW" data-exam="{{ exam.key }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>學發音</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='theme.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='ui.css') }}">
    <style>
        body { font-family: var(--font); background: var(--bg); margin: 0; padding: 40px 20px; display: flex; flex-direction: column; align-items: center; }
        .container { width: 100%; max-width: 1000px; }
        .summary { background: var(--hero); color: var(--hero-ink); padding: 25px 30px; border-radius: 15px; box-shadow: var(--edge-hero); margin-bottom: 24px; }
        .summary h1 { margin: 0 0 6px; font-size: 26px; }
        .summary p { margin: 0; opacity: .9; line-height: 1.6; }
        [hidden] { display: none !important; }

        .pick { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
        .pick select { max-width: 100%; min-width: 0; font-family: inherit; font-size: 16px; padding: 9px 12px; border-radius: 10px; border: 1px solid var(--line-strong); background: #fff; color: var(--ink); }
        .btn { border: none; background: var(--primary); color: #fff; border-radius: 10px; padding: 10px 18px; font-size: 16px; font-weight: bold; cursor: pointer; font-family: inherit; display: inline-flex; align-items: center; gap: 6px; }
        .btn.ghost { background: #fff; color: var(--primary); box-shadow: 0 0 0 1px var(--primary-300); }
        .btn:disabled { opacity: .4; cursor: default; }
        .suf { color: var(--primary); text-decoration: underline; text-decoration-thickness: 3px; text-underline-offset: 6px; }
        .suf-box { background: var(--primary-50); color: var(--ink); border-radius: 12px; padding: 12px 18px; line-height: 1.7; margin-bottom: 14px; font-size: 17px; }
        .suf-box b { color: var(--primary); font-size: 22px; }
        .kk { font-family: "Lucida Sans Unicode", "Segoe UI", Arial, sans-serif; }

        /* 目前這個字 */
        .card { background: #fff; border-radius: 16px; box-shadow: var(--edge); padding: 26px 20px; text-align: center; margin-bottom: 22px; }
        .progress { color: var(--muted); margin-bottom: 8px; }
        .big-word { font-size: 60px; font-weight: bold; color: var(--ink); letter-spacing: 1px; line-height: 1.15; overflow-wrap: anywhere; }
        .big-kk { font-size: 30px; color: var(--primary-600); margin-top: 8px; }
        .big-zh { color: var(--muted); font-size: 19px; margin-top: 8px; }
        .play-row { display: flex; gap: 18px; justify-content: center; margin: 22px 0 14px; flex-wrap: wrap; }
        .round-btn { border: none; width: 92px; height: 92px; border-radius: 50%; font-size: 36px; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-direction: column; font-family: inherit; }
        .round-btn small { font-size: 14px; margin-top: 2px; font-weight: bold; }
        .round-btn.main { background: var(--primary); color: #fff; }
        .round-btn.slow { background: var(--primary-50); color: var(--primary); box-shadow: 0 0 0 1px var(--primary-300); }
        .round-btn.speaking { animation: pulse 0.9s infinite; }
        @keyframes pulse { 50% { transform: scale(1.06); } }
        .nav { display: flex; gap: 10px; justify-content: center; }
        .tip { color: var(--muted); font-size: 14px; margin-top: 14px; line-height: 1.6; }

        /* 整個主題的單字清單 */
        .list-title { font-weight: bold; color: var(--ink-2); margin: 0 0 10px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px; }
        .w { border: none; background: #fff; box-shadow: var(--edge); border-radius: 12px; padding: 10px 12px; cursor: pointer; font-family: inherit; text-align: left; color: var(--ink); display: flex; flex-direction: column; gap: 2px; min-width: 0; }
        .w:hover { box-shadow: var(--edge-raised); }
        .w.on { box-shadow: 0 0 0 2px var(--primary); background: var(--primary-50); }
        .w b { font-size: 19px; overflow-wrap: anywhere; }
        .w .kk { color: var(--primary-600); font-size: 15px; }
        .w small { color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        @media (max-width: 600px) {
            body { padding: 24px 16px; }
            .big-word { font-size: 44px; }
            .big-kk { font-size: 24px; }
            .round-btn { width: 80px; height: 80px; font-size: 30px; }
            .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="nav-row">
        <a href="/dashboard/{{ student.id }}/{{ exam.key }}" class="nav-back"><span class="arrow">←</span>主介面</a>
        <a href="/learn/{{ student.id }}" class="nav-next">{{ icon('library') }} 單字庫<span class="arrow">→</span></a>
    </div>
    <div class="summary">
        <h1>{{ icon('volume') }} 學發音</h1>
        <p>看單字和 KK 音標，按「聽」學這個字怎麼唸，聽不清楚就按「慢慢聽」。選單最下面有「常見字尾」可以練。</p>
    </div>

    <div class="pick">
        <label for="src"><b>學哪些字：</b></label>
        <select id="src">
            <optgroup label="零基礎單字">
                {% for t in basic_themes %}<option value="{{ t.id }}">{{ t.id }} {{ t.name }}</option>{% endfor %}
            </optgroup>
            <optgroup label="一般英文單字">
                {% for t in general_themes %}<option value="{{ t.id }}">{{ t.id }} {{ t.name }}</option>{% endfor %}
            </optgroup>
            <optgroup label="常見字尾">
                {% for x in suffixes %}<option value="suf:{{ x.key }}">字尾 -{{ x.suf }}　/{{ x.kk }}/</option>{% endfor %}
            </optgroup>
        </select>
    </div>

    <div class="suf-box" id="suf-box" hidden></div>

    <div class="card">
        <div class="progress" id="progress"></div>
        <div class="big-word" id="word">載入單字中…</div>
        <div class="big-kk kk" id="kk"></div>
        <div class="big-zh" id="zh"></div>
        <div class="play-row">
            <button class="round-btn main" id="play">{{ icon('volume') }}<small>聽</small></button>
            <button class="round-btn slow" id="slow">{{ icon('slow') }}<small>慢慢聽</small></button>
        </div>
        <div class="nav">
            <button class="btn ghost" id="prev">← 上一個</button>
            <button class="btn" id="next">下一個 →</button>
        </div>
        <div class="tip">KK 音標裡的 <b class="kk">ˈ</b> 表示後面那一段要唸得比較重。聽完跟著唸幾次就會了。</div>
    </div>

    <p class="list-title" id="list-title"></p>
    <div class="grid" id="grid"></div>
</div>

<script src="{{ url_for('static', filename='ui.js') }}"></script>
<script>
const $ = id => document.getElementById(id);
const KEY = 'phonics-pos-{{ student.id }}';
const st = { list: [], idx: 0, suffix: null };
let userActed = false;   // 第一次載入不自動發音（瀏覽器會擋），使用者動過之後換字就自動唸
document.addEventListener('pointerdown', () => { userActed = true; }, { once: true });

function esc(t) { return String(t).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }
// 字尾模式：單字結尾的字尾、KK 結尾的念法標顏色
function markEnd(text, end) {
    if (!end || !text.endsWith(end)) return esc(text);
    return esc(text.slice(0, text.length - end.length)) + `<span class="suf">${esc(end)}</span>`;
}
function wordHtml(w) { return markEnd(w.word, st.suffix && st.suffix.suf); }
function kkHtml(w) { return w.kk ? '/' + markEnd(w.kk, st.suffix && st.suffix.kk) + '/' : ''; }
function loadPos() { try { return JSON.parse(localStorage.getItem(KEY) || '{}'); } catch (e) { return {}; } }
function savePos() { try { localStorage.setItem(KEY, JSON.stringify({ theme: $('src').value, idx: st.idx })); } catch (e) {} }

function say(rate, btn) {
    const w = st.list[st.idx];
    if (!w) return;
    document.querySelectorAll('.round-btn').forEach(b => b.classList.remove('speaking'));
    if (btn) btn.classList.add('speaking');
    UI.speak(w.word, { rate, onend: () => btn && btn.classList.remove('speaking') });
}

function show(autoPlay) {
    const w = st.list[st.idx];
    if (!w) { $('word').textContent = '這裡還沒有單字'; $('kk').textContent = ''; $('zh').textContent = ''; $('progress').textContent = ''; return; }
    $('progress').textContent = `第 ${st.idx + 1} / ${st.list.length} 個`;
    $('word').innerHTML = wordHtml(w);
    $('kk').innerHTML = kkHtml(w);
    $('zh').textContent = w.zh;
    $('prev').disabled = st.idx === 0;
    $('next').disabled = st.idx === st.list.length - 1;
    document.querySelectorAll('.w').forEach((b, i) => b.classList.toggle('on', i === st.idx));
    savePos();
    if (autoPlay && userActed) setTimeout(() => say(null, $('play')), 150);
}

async function load(startIdx) {
    $('word').textContent = '載入單字中…';
    const v = $('src').value, isSuf = v.startsWith('suf:');
    try {
        const q = isSuf ? 'suffix=' + encodeURIComponent(v.slice(4)) : 'theme=' + encodeURIComponent(v);
        const data = await (await fetch(`/phonics/{{ student.id }}/words?${q}`)).json();
        st.list = isSuf ? data.words : data;
        st.suffix = isSuf ? data.suffix : null;
    } catch (e) { st.list = []; st.suffix = null; }
    $('suf-box').hidden = !st.suffix;
    if (st.suffix) $('suf-box').innerHTML = `字尾 <b>-${esc(st.suffix.suf)}</b> 念 <b class="kk">/${esc(st.suffix.kk)}/</b>：${esc(st.suffix.hint)}`;
    st.idx = Math.min(Math.max(startIdx || 0, 0), Math.max(st.list.length - 1, 0));
    const opt = $('src').selectedOptions[0];
    $('list-title').textContent = st.list.length ? `${opt ? opt.textContent.trim() : ''}：共 ${st.list.length} 個字，點一下就唸` : '';
    $('grid').innerHTML = st.list.map((w, i) =>
        `<button class="w" data-i="${i}"><b>${wordHtml(w)}</b><span class="kk">${kkHtml(w)}</span><small>${esc(w.zh)}</small></button>`).join('');
    show(false);
}

$('grid').addEventListener('click', e => {
    const b = e.target.closest('.w');
    if (!b) return;
    st.idx = +b.dataset.i;
    show(false);
    say(null, $('play'));
    $('word').scrollIntoView({ block: 'center', behavior: 'smooth' });
});
$('play').addEventListener('click', () => say(null, $('play')));
$('slow').addEventListener('click', () => say(0.55, $('slow')));
$('next').addEventListener('click', () => { if (st.idx < st.list.length - 1) { st.idx++; show(true); } });
$('prev').addEventListener('click', () => { if (st.idx > 0) { st.idx--; show(true); } });
$('src').addEventListener('change', () => load(0));
document.addEventListener('keydown', e => {
    if (e.target.tagName === 'SELECT') return;
    if (e.key === 'ArrowRight') $('next').click();
    else if (e.key === 'ArrowLeft') $('prev').click();
    else if (e.key === ' ') { e.preventDefault(); $('play').click(); }
});

// 回到上次練到的主題和單字
const pos = loadPos();
if (pos.theme && [...$('src').options].some(o => o.value === pos.theme)) $('src').value = pos.theme;
load(pos.theme === $('src').value ? pos.idx : 0);
</script>
</body>
</html>
