<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>測驗系統主介面</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='ui.css') }}">
    <style>
        body { font-family: "Microsoft JhengHei", Arial, sans-serif; background-color: #f4f7f6; margin: 0; padding: 40px 20px; display: flex; flex-direction: column; align-items: center; }
        .dashboard-container { max-width: 800px; width: 100%; }
        
        /* 歡迎看板 */
        .welcome-banner { background: linear-gradient(135deg, #6dd5ed, #2193b0); color: white; padding: 30px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); margin-bottom: 30px; }
        .welcome-banner h1 { margin: 0 0 10px 0; font-size: 28px; }
        .welcome-banner p { margin: 0; font-size: 16px; opacity: 0.9; }

        /* 選單網格 */
        .menu-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; }
        
        /* 選單卡片 */
        .menu-card { background: white; padding: 25px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); text-align: center; text-decoration: none; color: #2c3e50; transition: transform 0.2s, box-shadow 0.2s; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 150px; }
        .menu-card:hover { transform: translateY(-5px); box-shadow: 0 6px 15px rgba(0,0,0,0.1); }
        .menu-icon { font-size: 40px; margin-bottom: 15px; }
        .menu-title { font-size: 20px; font-weight: bold; margin-bottom: 8px; }
        .menu-desc { font-size: 14px; color: #7f8c8d; }
        
        /* 未開放卡片樣式 */
        .locked-card { background: #e0e0e0; cursor: not-allowed; }
        .locked-card .menu-icon { filter: grayscale(100%); }
    </style>
</head>
<body>

<div class="dashboard-container">
    <!-- 歡迎看板 -->
    <div class="welcome-banner">
        <h1>👋 歡迎回來，{{ student.name }}</h1>
        <p>目前選修課程：{{ student.enrolled_course }} ｜ 已熟悉單字：{{ unlocked_count }} 字</p>
    </div>

    <!-- 功能選單 -->
    <div class="menu-grid ui-stagger">
        <!-- 1. 單字學習與圖鑑（原本的單字學習區＋單字圖鑑合併） -->
        <a href="/learn/{{ student.id }}" class="menu-card">
            <div class="menu-icon">📚</div>
            <div class="menu-title">單字學習與圖鑑<span class="go-arrow">→</span></div>
            <div class="menu-desc">依主題滑卡學單字：右滑熟、左滑不熟<br>✓ 熟 {{ unlocked_count }} / {{ total_count }} 字</div>
        </a>

        <!-- 2. 模擬測驗區 (預留給下一階段開發) -->
        <a href="/exam/{{ student.id }}" class="menu-card">
            <div class="menu-icon">📝</div>
            <div class="menu-title">模擬測驗區<span class="go-arrow">→</span></div>
            <div class="menu-desc">IELTS 聽說讀寫模考・目前開放：單字與句子<br>答錯自動進錯題本，可訂正與收藏</div>
        </a>
    </div>
</div>

<script src="{{ url_for('static', filename='ui.js') }}"></script>
</body>
</html>
