<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>測驗系統主介面</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='theme.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='ui.css') }}">
    <style>
        body { font-family: var(--font); background-color: var(--bg); margin: 0; padding: 40px 20px; display: flex; flex-direction: column; align-items: center; }
        .dashboard-container { max-width: 800px; width: 100%; }
        
        /* 歡迎看板 */
        .welcome-banner { background: var(--hero); color: var(--hero-ink); padding: 30px; border-radius: 15px; box-shadow: var(--edge-hero); margin-bottom: 30px; }
        .welcome-banner h1 { margin: 0 0 10px 0; font-size: 28px; }
        .welcome-banner p { margin: 0; font-size: 16px; opacity: 0.9; }

        /* 選單網格 */
        .menu-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; }
        
        /* 選單卡片 */
        .menu-card { background: white; padding: 25px; border-radius: 15px; box-shadow: var(--edge); text-align: center; text-decoration: none; color: var(--ink); transition: transform 0.2s, box-shadow 0.2s; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 150px; }
        .menu-card:hover { transform: translateY(-5px); box-shadow: var(--edge-raised); }
        .menu-icon { font-size: 40px; margin-bottom: 15px; }
        .menu-title { font-size: 20px; font-weight: bold; margin-bottom: 8px; }
        .menu-desc { font-size: 14px; color: var(--muted); }
        
        /* 未開放卡片樣式 */
        .locked-card { background: var(--line); cursor: not-allowed; }
        .locked-card .menu-icon { filter: grayscale(100%); }
    </style>
</head>
<body>

<div class="dashboard-container">
    <!-- 歡迎看板 -->
    <div class="welcome-banner">
        <h1>歡迎回來，{{ student.name }}</h1>
        <p>{{ student.enrolled_course }} ｜ 已熟 {{ unlocked_count }} 字</p>
    </div>

    <!-- 功能選單 -->
    <div class="menu-grid ui-stagger">
        <!-- 1. 單字學習與圖鑑（原本的單字學習區＋單字圖鑑合併） -->
        <a href="/learn/{{ student.id }}" class="menu-card">
            <div class="menu-icon">{{ icon('library') }}</div>
            <div class="menu-title">單字學習與圖鑑<span class="go-arrow">→</span></div>
            <div class="menu-desc">依主題滑卡背單字<br>✓ 熟 {{ unlocked_count }} / {{ total_count }} 字</div>
        </a>

        <!-- 單字測驗區：考單字學習區學過的字 -->
        <a href="/vocab-quiz/{{ student.id }}" class="menu-card">
            <div class="menu-icon">{{ icon('quiz') }}</div>
            <div class="menu-title">單字測驗區<span class="go-arrow">→</span></div>
            <div class="menu-desc">考學過的字，答錯回不熟區</div>
        </a>

        <!-- 2. 模擬測驗區：四技能自製題庫 -->
        <a href="/exam/{{ student.id }}" class="menu-card">
            <div class="menu-icon">{{ icon('exam') }}</div>
            <div class="menu-title">模擬測驗區<span class="go-arrow">→</span></div>
            <div class="menu-desc">聽・讀・寫・說，自動批改附解析</div>
        </a>
    </div>
</div>

<script src="{{ url_for('static', filename='ui.js') }}"></script>
</body>
</html>
