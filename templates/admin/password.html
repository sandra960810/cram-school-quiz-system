{% extends 'admin/base.html' %}
{% block title %}改密碼{% endblock %}
{% block body %}
<div class="hero"><h1>{{ icon('key') }} 修改管理員密碼</h1><p>改完之後，其他已登入的裝置都要重新登入。</p></div>
<div class="panel" style="max-width:460px">
    {% if error %}<div class="flash bad">{{ error }}</div>{% endif %}
    <form method="post">
        <input type="hidden" name="csrf" value="{{ admin_csrf }}">
        <label class="f">目前的密碼</label>
        <input type="password" name="old" autocomplete="current-password" required>
        <label class="f">新密碼 <span class="tip">至少 6 個字</span></label>
        <input type="password" name="password" autocomplete="new-password" required>
        <label class="f">再輸入一次新密碼</label>
        <input type="password" name="password2" autocomplete="new-password" required>
        <p></p><button class="btn">更新密碼</button>
    </form>
</div>
{% endblock %}
