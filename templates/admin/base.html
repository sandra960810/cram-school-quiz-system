<!DOCTYPE html>
<html lang="zh-TW" data-exam="{{ admin_exam or 'ielts' }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>{% block title %}工作人員後台{% endblock %}｜測驗系統</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='theme.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='ui.css') }}">
    <style>
        body { font-family: var(--font); background: var(--bg); margin: 0; padding: 24px 16px 80px; color: var(--ink); }
        .wrap { max-width: 980px; margin: 0 auto; }
        .topbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 18px; font-size: 14px; }
        .topbar .brand { font-weight: bold; font-size: 16px; display: flex; align-items: center; gap: 6px; color: var(--ink); text-decoration: none; }
        .topbar .sp { flex: 1; }
        .topbar a, .linkbtn { color: var(--primary); text-decoration: none; font-weight: bold; background: none; border: none; cursor: pointer; font: inherit; padding: 0; }
        .hero { background: var(--hero); color: var(--hero-ink); padding: 22px 26px; border-radius: 15px; box-shadow: var(--edge-hero); margin-bottom: 20px; }
        .hero h1 { margin: 0 0 6px; font-size: 24px; display: flex; align-items: center; gap: 8px; }
        .hero p { margin: 0; opacity: .92; line-height: 1.6; }
        .panel { background: #fff; border-radius: 14px; box-shadow: var(--edge); padding: 20px 22px; margin-bottom: 16px; }
        .panel h2 { margin: 0 0 6px; font-size: 18px; }
        .muted { color: var(--muted); font-size: 13px; line-height: 1.6; }
        .flash { padding: 12px 16px; border-radius: 12px; margin-bottom: 12px; font-size: 15px; line-height: 1.5; }
        .flash.ok { background: var(--ok-50); color: var(--ok-ink); }
        .flash.warn { background: var(--warn-50); color: var(--warn-ink); }
        .flash.bad { background: var(--bad-50); color: var(--bad-ink); }
        .btn { display: inline-flex; align-items: center; gap: 6px; padding: 10px 18px; border-radius: 10px; border: none; cursor: pointer; font: inherit; font-weight: bold; font-size: 15px; text-decoration: none; background: var(--primary); color: #fff; box-shadow: var(--edge-raised); }
        .btn:hover { filter: brightness(1.06); }
        .btn.ghost { background: #fff; color: var(--primary); box-shadow: 0 0 0 2px var(--primary-100, var(--line)); }
        .btn.danger { background: var(--bad); }
        .btn.small { padding: 6px 12px; font-size: 13px; }
        label.f { display: block; font-weight: bold; font-size: 14px; margin: 14px 0 6px; }
        label.f .req { color: var(--bad); }
        label.f .tip { font-weight: normal; color: var(--muted); font-size: 12px; margin-left: 6px; }
        input[type=text], input[type=password], input[type=search], input[type=email], input[type=tel], input[type=date], select, textarea {
            width: 100%; box-sizing: border-box; padding: 10px 12px; border: 2px solid var(--line); border-radius: 10px;
            font: inherit; font-size: 15px; background: #fff; color: var(--ink); }
        input:focus, select:focus, textarea:focus { outline: none; border-color: var(--primary); }
        textarea { min-height: 70px; resize: vertical; line-height: 1.5; }
        .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 16px; }
        @media (max-width: 600px) { .row2 { grid-template-columns: 1fr; } .hero { padding: 18px; } .hero h1 { font-size: 20px; } .panel { padding: 16px; } }
    </style>
    {% block head %}{% endblock %}
</head>
<body>
<div class="wrap">
    {% if session.get('admin') %}
    <div class="topbar">
        <a class="brand" href="{{ url_for('admin.home') }}">{{ icon('key') }} 工作人員後台</a>
        <a href="{{ url_for('admin.students') }}">學生審核開通</a>
        <span class="sp"></span>
        <a href="{{ url_for('admin.change_password') }}">改密碼</a>
        <form method="post" action="{{ url_for('admin.logout') }}" style="margin:0"><button class="linkbtn">登出</button></form>
    </div>
    {% endif %}
    {% with msgs = get_flashed_messages(with_categories=true) %}
        {% for cat, m in msgs %}<div class="flash {{ 'warn' if cat == 'warn' else 'ok' }}">{{ m }}</div>{% endfor %}
    {% endwith %}
    {% block body %}{% endblock %}
</div>
<script src="{{ url_for('static', filename='ui.js') }}"></script>
{% block scripts %}{% endblock %}
</body>
</html>
